# ─────────────────────────────────────────────────────────────────────────────
# alembic.ini
#
# Alembic is the official SQLAlchemy migration tool.
# It tracks schema changes (new tables, new columns) and applies them to the DB
# without dropping and recreating everything.
#
# USAGE:
#   alembic revision --autogenerate -m "initial tables"
#   alembic upgrade head
# ─────────────────────────────────────────────────────────────────────────────

[alembic]
# Path to the alembic/ folder (migration scripts live here)
script_location = alembic

# The database URL — overridden in env.py to read from .env
sqlalchemy.url = mysql+pymysql://root:password@localhost:3306/expense_tracker

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
